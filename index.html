<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Dashboard de Notas Fiscais - Acordo Brumadinho</title>

    <!-- ============================================================
         BIBLIOTECAS EXTERNAS
    ============================================================ -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>

    <!-- Chart.js | jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>

        /* ============================================================
           1. VARIÁVEIS DE CORES
        ============================================================ */
        :root {
            --primary-dark:      #1a3a5c;
            --primary-darker:    #0f2a44;
            --accent-red:        #b93c42;
            --accent-bright:     #db233f;
            --background-light:  #f5f7fa;
            --success-green:     #28a745;
            --warning-yellow:    #ffc107;
            --info-blue:         #17a2b8;
        }

        /* ============================================================
           2. RESET E CONFIGURAÇÕES GLOBAIS
        ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; overflow-x: hidden; margin: 0; padding: 0; height: auto; min-height: auto; }
        body {
            font-family: 'Montserrat', Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-light);
            padding-bottom: 15px;
            overflow-x: hidden;
            min-height: auto;
            height: auto;
            position: relative;
        }
        body, button, input, select, textarea, span, div { font-family: 'Montserrat', sans-serif !important; }
        .material-icons { font-family: 'Material Icons' !important; font-size: 14px; vertical-align: middle; }

        /* ============================================================
           3. LAYOUT PRINCIPAL
        ============================================================ */
        .main-container { height: auto; min-height: auto; overflow: visible; position: relative; }
        .container-fluid { width: 100%; max-width: 88% !important; padding: 0 40px; margin: 0; height: auto; min-height: auto; }
        .container { max-width: 85% !important; }
        .dashboard-container { width: 100%; max-width: 100%; padding: 0 40px; margin: 0 auto; height: auto; min-height: auto; }
        .tab-content, .tab-pane { width: 100%; height: auto; min-height: auto; overflow: visible; }
        .table-container { height: auto; min-height: auto; overflow: visible; position: relative; }
        .iframe-mode { overflow: visible !important; }

        /* ============================================================
           4. DATA DE ATUALIZAÇÃO
        ============================================================ */
        .data-atualizacao-container { display: flex; justify-content: left; align-items: center; margin: 15px 0; }
        .data-atualizacao-box {
            background: transparent !important;
            border-radius: 8px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--primary-dark);
            font-weight: 600;
            box-shadow: none;
        }
        .data-atualizacao-box i { font-size: 14px; color: var(--accent-red); }

        /* ============================================================
           5. FILTROS
        ============================================================ */
        .filter-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            padding: 20px;
            margin-bottom: 20px;
            border-left: none;
            width: 100%;
        }
        .filter-label { font-size: 13px; font-weight: 600; color: #1a3a5c; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .filter-label i { font-size: 14px; color: var(--accent-red); }
        .form-control, .form-select {
            border: 2px solid #e9ecef;
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 13px;
            transition: all 0.3s ease;
            height: auto;
            width: 100%;
        }
        .form-control:focus, .form-select:focus { border-color: var(--accent-red); box-shadow: 0 0 0 2px rgba(185,60,66,0.15); }
        .modern-select {
            border: 1.5px solid #dfe5ec !important;
            border-radius: 8px !important;
            padding: 10px 12px !important;
            font-size: 14px !important;
            height: 48px !important;
            line-height: 1.5 !important;
            background-color: #fff;
            transition: all 0.2s ease;
            width: 100%;
        }
        .modern-select:focus { border-color: #1a3a5c !important; box-shadow: 0 0 0 2px rgba(26,58,92,0.1); }
        .filters-row { display: flex; gap: 15px; width: 100%; flex-wrap: wrap; }
        .filter-group { flex: 1; min-width: 120px; }
        .filter-buttons-group { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-left: auto; }
        .botoes-abaixo { margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; }

        /* ============================================================
           6. CARDS DE MÉTRICAS
        ============================================================ */
        .metric-card {
            background: white;
            border-radius: 8px;
            border: 1px solid #e5e9ef;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
            overflow: hidden;
            height: 100%;
            transition: box-shadow 0.25s ease, transform 0.25s ease;
        }
        .metric-card:hover { box-shadow: 0 8px 24px rgba(26,58,92,0.13); transform: translateY(-2px); }
        .metric-header {
            background: #20445d;
            color: white;
            font-size: 13px;
            font-weight: 600;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .metric-body { padding: 12px 15px; }
        .metric-value { font-size: 20px; font-weight: 700; color: #171c21; }
        .metric-sublabel { font-size: 10px; color: #94a3b8; font-weight: 500; margin-top: 2px; }

        /* ============================================================
           7. TABELAS
        ============================================================ */
        .table-header {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-darker) 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .table-title { font-size: 13px; font-weight: 600; margin: 0; }
        .table-badge { background: #1a3a5c; color: white; padding: 5px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; white-space: nowrap; }
        .table-fixed-header-container { position: relative; overflow: auto; width: 100%; max-height: 600px; }
        .table-fixed-header-container table thead th {
            background-color: #54697b !important;
            color: white !important;
            position: sticky;
            top: 0;
            z-index: 10;
            font-weight: 600;
            padding: 12px 10px;
            font-size: 12px;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .table { width: 100%; font-size: 13px; border-collapse: collapse; table-layout: auto; }
        .table th, .table td { border: 1px solid #d6dee6; }
        .table thead th {
            background-color: #54697b !important;
            color: white !important;
            font-weight: 600;
            font-size: 12px;
            padding: 12px 10px;
            text-transform: uppercase;
            border: 1px solid #d6dee6;
            cursor: pointer;
            user-select: none;
        }
        .table thead th:first-child { border-top-left-radius: 8px; }
        .table thead th:last-child  { border-top-right-radius: 8px; }
        .table thead th:hover { background-color: #3d5566 !important; }
        .sortable-header { cursor: pointer; position: relative; padding-right: 22px !important; }
        .sortable-header:hover { background-color: #3d5566 !important; }
        .sortable-header i { font-size: 13px; position: absolute; right: 5px; top: 50%; transform: translateY(-50%); opacity: 0.8; }
        .table tbody tr { background-color: #ffffff; }
        .table tbody td { padding: 10px 10px; vertical-align: middle; border-bottom: 1px solid #f1f1f1; font-size: 12px; }
        .table tbody tr:nth-child(even) { background-color: #ffffff; }
        .table tbody tr:hover { background-color: rgba(41,67,90,0.04); }
        .table tfoot { position: sticky; bottom: 0; z-index: 20; }
        .table tfoot tr, .table tfoot td { background-color: #dfe3e8 !important; font-weight: 700; font-size: 12px; }
        .table-bordered { border: 1px solid #dee2e6; width: 100%; }
        .table-bordered th, .table-bordered td { border: 1px solid #dee2e6; padding: 12px; vertical-align: top; }
        .table-responsive { display: block; width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .orgao-link { color: #006a82; text-decoration: none; font-weight: 400; cursor: pointer; }
        .orgao-link:hover { color: var(--accent-red); text-decoration: underline; }
        .text-right { text-align: right !important; }
        .text-center { text-align: center !important; }

        /* ============================================================
           8. BOTÕES
        ============================================================ */
        .btn-pesquisa {
            background: linear-gradient(to right, #20445d, #20445d);
            border: none;
            padding: 0 16px;
            font-weight: 600;
            border-radius: 6px;
            transition: all 0.3s ease;
            font-size: 13px;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            height: 36px;
            white-space: nowrap;
        }
        .btn-pesquisa:hover { background: linear-gradient(to right, var(--accent-red), #a32c32); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(185,60,66,0.2); color: white; }
        .btn-secondary-custom {
            background: white;
            border: 2px solid var(--primary-darker);
            color: var(--primary-darker);
            padding: 0 16px;
            font-weight: 600;
            font-size: 13px;
            border-radius: 6px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            height: 36px;
            white-space: nowrap;
            text-decoration: none !important;
        }
        .btn-secondary-custom:hover { background-color: #132837 !important; color: white !important; border-color: #132837 !important; }
        .btn-export {
            appearance: none;
            -webkit-appearance: none;
            background: transparent !important;
            border: 1px solid #d6dee6;
            color: #1a3a5c;
            padding: 0 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            height: 32px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none !important;
        }
        .btn-export i { font-size: 14px !important; }
        button.btn-export:hover, a.btn-export:hover { background-color: #1a3a5c !important; border-color: #1a3a5c !important; color: #ffffff !important; }
        .btn-action {
            padding: 4px;
            border-radius: 7px;
            border: 1.5px solid #1a3a5c;
            background-color: #ffffff;
            color: #1a3a5c;
            width: 32px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .btn-action:hover { background-color: #1a3a5c; color: #ffffff; }
        .btn-topo {
            background: #eeeff5;
            color: #1a3a5c;
            border: 1px solid #d6dee6;
            border-radius: 12px;
            padding: 0 16px;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            height: 32px;
        }
        .btn-topo:hover { background-color: #1a3a5c; color: #ffffff; border-color: #1a3a5c; }

        /* ============================================================
           9. NAVEGAÇÃO (abas)
        ============================================================ */
        .nav-tabs-container { background: transparent; padding: 10px 0; margin-top: 15px; margin-bottom: 15px; width: 100%; }
        .nav-tabs { border: none !important; gap: 10px; width: 100%; flex-wrap: wrap; }
        .nav-tabs .nav-link {
            border: none !important;
            background: #ffffff !important;
            border-radius: 10px !important;
            padding: 8px 18px !important;
            font-weight: 500;
            font-size: 14px;
            color: #1a3a5c !important;
            display: inline-flex !important;
            align-items: center;
            gap: 6px;
            transition: all .25s ease;
        }
        .nav-tabs .nav-link:hover { background: #e6e9ed !important; }
        .nav-tabs .nav-link.active { background: #234c63 !important; color: #fff !important; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .nav-tabs .material-icons { font-size: 14px !important; }

        /* ============================================================
           10. MODAL
        ============================================================ */
        .modal-full-custom { max-width: 82% !important; width: 82% !important; }
        .modal-creative .modal-header {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-darker) 100%);
            color: white !important;
            padding: 15px 20px;
            border-bottom: none;
        }
        .modal-creative .modal-header .modal-title { color: white !important; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .modal-creative .modal-header .btn-close { filter: brightness(0) invert(1); opacity: 1; }
        .modal-creative .modal-header .btn-close:hover { opacity: 0.8; }
        .modal-creative .modal-body { padding: 20px; background: #f8fafc; }
        .info-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 12px;
            border: 1px solid #e2e8f0;
        }
        .info-label { font-size: 11px; text-transform: uppercase; color: #6c757d; font-weight: 600; margin-bottom: 4px; }
        .info-value { font-size: 13px; font-weight: 600; color: var(--primary-dark); word-break: break-word; }
        .info-value.highlight { font-size: 15px; color: var(--accent-red); }

        /* ============================================================
           11. PAGINAÇÃO
        ============================================================ */
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px 20px;
            background: white;
            border-top: 1px solid #dee2e6;
            width: 100%;
            gap: 12px;
            flex-wrap: wrap;
        }
        .pagination-info { font-size: 12px; color: #6c757d; }
        .pagination .page-link { color: var(--primary-dark); border-color: #dee2e6; font-size: 13px; padding: 4px 10px; }
        .pagination .page-link:hover { color: var(--accent-red); background-color: #f8f9fa; }
        .pagination .page-item.active .page-link { background-color: var(--primary-dark); border-color: var(--primary-dark); color: white; }
        .items-per-page {
            height: 34px;
            min-width: 80px;
            border-radius: 8px;
            border: 1px solid #d6dee6;
            padding: 4px 28px 4px 10px;
            font-size: 13px;
            font-weight: 600;
            color: #1a3a5c;
            background-color: #ffffff;
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
            background-image: url("data:image/svg+xml;utf8,<svg fill='%231a3a5c' height='20' viewBox='0 0 24 24' width='20' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 6px center;
        }

        /* ============================================================
           12. BUSCA NA TABELA
        ============================================================ */
        .table-search-container {
            display: flex;
            align-items: center;
            white-space: nowrap;
            background: #ffffff;
            border: 1px solid #d6dee6;
            border-radius: 8px;
            padding: 5px 10px;
            height: 34px;
        }
        .table-search-container:hover { border-color: #1a3a5c; }
        .table-search-input { border: none !important; outline: none; background: transparent; font-size: 12px; width: 180px; color: #1a3a5c; }
        .table-search-input::placeholder { color: #94a3b8; }

        /* ============================================================
           13. BADGES
        ============================================================ */
        .badge-orcamentaria {
            background-color: #dcf5e7;
            color: #0f6b3a;
            border: 1px solid #b2e6c8;
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 10.5px;
            font-weight: 700;
            display: inline-block;
        }
        .badge-extra {
            background-color: #fff8e1;
            color: #7a5b00;
            border: 1px solid #ffe082;
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 10.5px;
            font-weight: 700;
            display: inline-block;
        }

        /* ============================================================
           14. TOOLBAR
        ============================================================ */
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .toolbar-left  { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .toolbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

        /* ============================================================
           15. LOADING
        ============================================================ */
        .loading-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(238,241,246,0.95);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 14px;
        }
        .loading-progress { font-size: 13px; color: #20445d; font-weight: 700; }

        /* ============================================================
           16. TOAST
        ============================================================ */
        .toast-sucesso {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #e6f4ea;
            color: #1e4620;
            border-radius: 12px;
            padding: 14px 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            z-index: 9999;
            min-width: 280px;
        }
        .toast-content { display: flex; align-items: center; justify-content: center; width: 100%; text-align: center; gap: 10px; }
        .toast-content i { color: #28a745; font-size: 14px; }
        .toast-close { cursor: pointer; font-size: 14px; margin-left: 10px; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px) translateX(-50%); } to { opacity: 1; transform: translateY(0) translateX(-50%); } }

        /* ============================================================
           17. METADADOS
        ============================================================ */
        .metadata-table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .metadata-table th { background: var(--primary-dark); color: white; font-weight: 600; font-size: 12px; padding: 12px 15px; text-transform: uppercase; }
        .metadata-table td { padding: 9px 15px; font-size: 12px; border-bottom: 1px solid #e9ecef; }
        .metadata-table tr:last-child td { border-bottom: none; }
        .metadata-table td:first-child { font-weight: 600; color: var(--primary-dark); }
        .metadata-table td:nth-child(2) { color: #495057; }
        .metadata-table td:last-child { color: #6c757d; font-style: italic; }

        /* ============================================================
           18. RESPONSIVIDADE
        ============================================================ */
        @media (max-width: 992px) {
            .container-fluid, .dashboard-container { padding: 0 15px; }
            .modal-full-custom { max-width: 95% !important; width: 95% !important; }
        }
        @media (max-width: 768px) {
            .filters-row { flex-direction: column; align-items: stretch; }
            .filter-group { min-width: 100%; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .table-search-input { width: 100% !important; }
        }

    </style>
</head>
<body class="iframe-mode">

<!-- ============================================================
     ESTRUTURA PRINCIPAL
============================================================ -->
<div class="main-container">
    <div class="container-fluid dashboard-container">

        <!-- Navegação por abas -->
        <div class="nav-tabs-container">
            <ul class="nav nav-tabs" id="dashboardTabs" role="tablist">
                <li class="nav-item">
                    <button class="nav-link active" id="visao-geral-tab"
                        data-bs-toggle="tab" data-bs-target="#visao-geral">
                        <i class="material-icons">bar_chart</i>Visão Geral
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" id="consulta-notas-tab"
                        data-bs-toggle="tab" data-bs-target="#consulta-notas">
                        <i class="material-icons">receipt</i>Consulta de Notas
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" id="consulta-itens-tab"
                        data-bs-toggle="tab" data-bs-target="#consulta-itens">
                        <i class="material-icons">list_alt</i>Consulta de Itens
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" id="downloads-tab"
                        data-bs-toggle="tab" data-bs-target="#downloads">
                        <i class="material-icons">download</i>Downloads
                    </button>
                </li>
            </ul>
        </div>

        <!-- Data de atualização -->
        <div class="data-atualizacao-container">
            <div class="data-atualizacao-box">
                <i class="material-icons">event</i>
                Data de atualização: <span id="data-atualizacao-header" style="margin-left:4px;">carregando...</span>
            </div>
        </div>

        <!-- Conteúdo das abas -->
        <div class="tab-content" id="dashboardTabsContent">
            <div class="tab-pane fade show active" id="visao-geral" role="tabpanel">
                <div id="visao-geral-content">Carregando...</div>
            </div>
            <div class="tab-pane fade" id="consulta-notas" role="tabpanel">
                <div id="consulta-notas-content">Carregando...</div>
            </div>
            <div class="tab-pane fade" id="consulta-itens" role="tabpanel">
                <div id="consulta-itens-content">Carregando...</div>
            </div>
            <div class="tab-pane fade" id="downloads" role="tabpanel">
                <div id="downloads-content">Carregando...</div>
            </div>
        </div>

    </div>
</div>

<!-- ============================================================
     MODAL DETALHES DA NOTA FISCAL
============================================================ -->
<div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-full-custom modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content modal-creative">
            <div class="modal-header">

<script>

// ============================================================
// 1. CONFIGURAÇÕES
// ============================================================
const BASE_URL = 'https://raw.githubusercontent.com/transparencia-mg/portal_notas_fiscais/refs/heads/main/dataset/data/';
const GITHUB_API = 'https://api.github.com/repos/transparencia-mg/portal_notas_fiscais/contents/dataset/data';

const meses = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const anosDisponiveis = ['2026','2025','2024','2023','2022'];

// Cache de dados por ano
const cacheNotas = {};
const cacheItens = {};

// Estado atual dos dados
let dadosNotas = [];
let dadosItens = [];
let dadosCompletosNF = [];
let dadosVisaoGeral = [];
let dadosVisaoGeralFiltrados = [];
let todasNotas = [];
let notasFiltradas = [];
let todosItens = [];
let itensFiltrados = [];

let anoAtual = '2026';
let carregando = false;

// Paginação
let paginaAtualNotas = 1;
let itensPorPaginaNotas = 25;
let totalPaginasNotas = 1;
let paginaAtualItens = 1;
let itensPorPaginaItens = 25;
let totalPaginasItens = 1;

// Ordenação
let sortConfigNotas = { column: 'data_de_emissao', direction: 'desc' };
let sortConfigItens = { column: 'data_emissao', direction: 'desc' };
let sortConfigVG    = { column: 'total', direction: 'desc' };

// ============================================================
// 2. AUXILIARES
// ============================================================
function mostrarLoading(show, msg) {
    document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
    if (msg) document.getElementById('loadingProgress').textContent = msg;
}

function iframeUpdateHeight() {
    const h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight) + 10;
    try {
        if (window.parent && window.parent !== window)
            window.parent.postMessage({ iframeHeight: h, iframeResize: true, type: 'resize' }, '*');
    } catch(e) {}
}

function mostrarToast() {
    const toast = document.getElementById('toastSucesso');
    toast.style.display = 'flex';
    toast.style.animation = 'none';
    toast.offsetHeight;
    toast.style.animation = 'fadeInUp 0.3s ease';
    setTimeout(() => { toast.style.display = 'none'; }, 3000);
}
function fecharToast() { document.getElementById('toastSucesso').style.display = 'none'; }

function copiarLink() {
    navigator.clipboard.writeText(window.location.href)
        .then(() => mostrarToast())
        .catch(() => alert('Erro ao copiar o link'));
}

function voltarAoTopo() {
    if (window.parent && window.parent !== window)
        window.parent.scrollTo({ top: 0, behavior: 'smooth' });
    else
        window.scrollTo({ top: 0, behavior: 'smooth' });
}

function formatarMoeda(valor) {
    if (valor === undefined || valor === null || isNaN(valor)) return 'R$ 0,00';
    return parseFloat(valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', minimumFractionDigits: 2 });
}

function formatarData(dataStr) {
    if (!dataStr) return '-';
    const match = dataStr.match(/(\d{4})-(\d{2})-(\d{2})/);
    return match ? `${match[3]}/${match[2]}/${match[1]}` : dataStr;
}

function extrairAno(dataStr) {
    if (!dataStr) return null;
    const match = dataStr.match(/(\d{4})/);
    return match ? match[1] : null;
}

function parseCSV(texto) {
    const linhas = texto.split('\n').filter(l => l.trim());
    if (linhas.length === 0) return [];
    const cabecalhos = linhas[0].split(';').map(h => h.trim().replace(/^\uFEFF/, ''));
    const dados = [];
    for (let i = 1; i < linhas.length; i++) {
        if (!linhas[i].trim()) continue;
        const valores = linhas[i].split(';');
        const linha = {};
        cabecalhos.forEach((cab, idx) => {
            let valor = valores[idx] || '';
            valor = valor.trim().replace(/^"/, '').replace(/"$/, '');
            if (cab.includes('valor') || cab.includes('Valor') || cab.includes('qtde'))
                valor = parseFloat(valor.replace(',', '.')) || 0;
            linha[cab] = valor;
        });
        dados.push(linha);
    }
    return dados;
}

function getSortIcon(column, config) {
    if (config.column !== column) return 'unfold_more';
    return config.direction === 'asc' ? 'arrow_upward' : 'arrow_downward';
}

// ============================================================
// 3. DATA DE ATUALIZAÇÃO VIA GITHUB ACTIONS + COMMITS
// ============================================================
async function setupAtualizacaoData() {
    const el = document.getElementById('data-atualizacao-header');
    try {
        // 1ª tentativa: último workflow run concluído com sucesso
        const actionsResp = await fetch(
            'https://api.github.com/repos/transparencia-mg/portal_notas_fiscais/actions/runs?status=success&per_page=1'
        );
        if (actionsResp.ok) {
            const actionsData = await actionsResp.json();
            if (actionsData.workflow_runs && actionsData.workflow_runs.length > 0) {
                const ultimoRun = actionsData.workflow_runs[0];
                const data = new Date(ultimoRun.updated_at || ultimoRun.created_at);
                el.textContent = data.toLocaleDateString('pt-BR');
                return;
            }
        }

        // 2ª tentativa: commit mais recente na pasta dataset/data
        const commitResp = await fetch(
            'https://api.github.com/repos/transparencia-mg/portal_notas_fiscais/commits?path=dataset/data&per_page=1'
        );
        if (commitResp.ok) {
            const commits = await commitResp.json();
            if (commits && commits.length > 0) {
                const data = new Date(commits[0].commit.committer.date);
                el.textContent = data.toLocaleDateString('pt-BR');
                return;
            }
        }

        // 3ª tentativa: arquivo CSV mais recente da pasta
        const dirResp = await fetch(GITHUB_API);
        if (dirResp.ok) {
            const arquivos = await dirResp.json();
            const csvFiles = arquivos
                .filter(f => f.name && f.name.match(/^notas_\w+\.csv$/))
                .sort((a, b) => b.name.localeCompare(a.name));
            if (csvFiles.length > 0) {
                const arqResp = await fetch(
                    `https://api.github.com/repos/transparencia-mg/portal_notas_fiscais/commits?path=dataset/data/${csvFiles[0].name}&per_page=1`
                );
                if (arqResp.ok) {
                    const arqCommits = await arqResp.json();
                    if (arqCommits && arqCommits.length > 0) {
                        el.textContent = new Date(arqCommits[0].commit.committer.date).toLocaleDateString('pt-BR');
                        return;
                    }
                }
            }
        }

        el.textContent = 'Não disponível';
    } catch(e) {
        el.textContent = 'Não disponível';
    }
}

// ============================================================
// 4. CARREGAMENTO DE DADOS
// ============================================================
async function carregarDadosAno(ano, mostrarLoadingScreen = true) {
    if (cacheNotas[ano] && cacheItens[ano]) {
        return { notas: cacheNotas[ano], itens: cacheItens[ano] };
    }
    if (mostrarLoadingScreen) mostrarLoading(true, `Carregando dados de ${ano}…`);
    try {
        const arquivosNotas = [];
        const arquivosItens = [];

        // Detecta meses disponíveis para 2026 (jan a abr)
        const meses2026 = ['jan','fev','mar','abr'];

        if (ano === '2026') {
            meses2026.forEach(mes => {
                arquivosNotas.push(`${BASE_URL}notas_${mes}26.csv`);
                arquivosItens.push(`${BASE_URL}itensnota_${mes}26.csv`);
            });
        } else {
            meses.forEach(mes => {
                const anoDois = ano.slice(-2);
                arquivosNotas.push(`${BASE_URL}notas_${mes}${anoDois}.csv`);
                arquivosItens.push(`${BASE_URL}itensnota_${mes}${anoDois}.csv`);
            });
        }

        const [notasRes, itensRes] = await Promise.all([
            Promise.allSettled(arquivosNotas.map(url => fetch(url).then(r => r.ok ? r.text() : null))),
            Promise.allSettled(arquivosItens.map(url => fetch(url).then(r => r.ok ? r.text() : null)))
        ]);

        let notas = [];
        notasRes.forEach(r => { if (r.status === 'fulfilled' && r.value) notas.push(...parseCSV(r.value)); });

        let itens = [];
        itensRes.forEach(r => { if (r.status === 'fulfilled' && r.value) itens.push(...parseCSV(r.value)); });

        notas = notas.map(nota => ({
            ...nota,
            ano: extrairAno(nota.data_de_emissao),
            numero_nota: `${nota.numero}${nota.serie ? '-'+nota.serie : ''}`
        }));

        cacheNotas[ano] = notas;
        cacheItens[ano] = itens;
        return { notas, itens };
    } catch(error) {
        return { notas: [], itens: [] };
    } finally {
        if (mostrarLoadingScreen) mostrarLoading(false);
    }
}

async function carregarAnoInicial() {
    mostrarLoading(true, 'Carregando dados de 2026…');
    try {
        const { notas, itens } = await carregarDadosAno('2026', false);
        dadosNotas = notas;
        dadosItens = itens;
        processarDados();
        renderizarVisaoGeral();
        renderizarConsultaNotas();
        renderizarConsultaItens();
        renderizarDownloads();
        setTimeout(iframeUpdateHeight, 500);
    } catch(error) {
        console.error('Erro:', error);
    } finally {
        mostrarLoading(false);
    }
}

async function alterarAno(ano, componente) {
    if (ano === anoAtual || carregando) return;
    carregando = true;
    mostrarLoading(true, `Carregando dados de ${ano}…`);
    try {
        const { notas, itens } = await carregarDadosAno(ano, false);
        anoAtual = ano;
        dadosNotas = notas;
        dadosItens = itens;
        processarDados();
        if (componente === 'vg') renderizarVisaoGeral();
        else if (componente === 'notas') renderizarConsultaNotas();
        else if (componente === 'itens') renderizarConsultaItens();
        setTimeout(iframeUpdateHeight, 200);
    } finally {
        carregando = false;
        mostrarLoading(false);
    }
}

// ============================================================
// 5. PROCESSAMENTO
// ============================================================
function processarDados() {
    const itensPorNota = {};
    dadosItens.forEach(item => {
        const chave = `${item.orgao_emissor}|${item.numero}|${item.serie || ''}|${item.sequencial || ''}`;
        if (!itensPorNota[chave]) itensPorNota[chave] = [];
        itensPorNota[chave].push(item);
    });

    dadosCompletosNF = dadosNotas.map(nota => ({
        ...nota,
        itens: itensPorNota[`${nota.orgao_emissor}|${nota.numero}|${nota.serie || ''}|${nota.sequencial || ''}`] || []
    }));

    const mapaVG = new Map();
    dadosCompletosNF.forEach(nota => {
        if (!nota.valor_total_com_impostos) return;
        const natureza  = nota.natureza || 'Não informado';
        const indicador = nota.indicador_de_orcamento || 'Não informado';
        const chave = `${nota.orgao_emissor}|${natureza}|${indicador}`;
        if (!mapaVG.has(chave)) mapaVG.set(chave, { orgao: nota.orgao_emissor, natureza, indicador, total: 0, notas: [] });
        const reg = mapaVG.get(chave);
        reg.total += parseFloat(nota.valor_total_com_impostos) || 0;
        reg.notas.push(nota);
    });

    dadosVisaoGeral = Array.from(mapaVG.values());
    dadosVisaoGeralFiltrados = [...dadosVisaoGeral];
    sortConfigVG = { column: 'total', direction: 'desc' };
    dadosVisaoGeralFiltrados.sort((a,b) => b.total - a.total);

    todasNotas = [...dadosCompletosNF];
    notasFiltradas = [...todasNotas];

    const mapaNotas = new Map();
    dadosCompletosNF.forEach(nota => {
        const chave = `${nota.orgao_emissor}|${nota.numero}|${nota.serie || ''}|${nota.sequencial || ''}`;
        mapaNotas.set(chave, { natureza: nota.natureza, ano: nota.ano, fornecedor: nota.fornecedor_nome_empresarial, data_emissao: nota.data_de_emissao });
    });

    todosItens = dadosItens.map(item => {
        const chave = `${item.orgao_emissor}|${item.numero}|${item.serie || ''}|${item.sequencial || ''}`;
        const notaInfo = mapaNotas.get(chave) || {};
        return { ...item, ano: notaInfo.ano, natureza: notaInfo.natureza, fornecedor_nome: notaInfo.fornecedor, data_emissao: notaInfo.data_emissao, chave_nota: chave };
    });
    itensFiltrados = [...todosItens];
}

                <label class="filter-label">Indicador de Orçamento</label>

        </div>

    <!-- CARDS MÉTRICAS -->

            <div class="metric-card">
                <div class="metric-header">Total de Registros</div>

                <div class="metric-header">Total de Notas</div>
                <div class="metric-body">
                    <div class="metric-value">${totalNotas.toLocaleString('pt-BR')}</div>
                    <div class="metric-sublabel">${orgaosUnicos} órgão(s)</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="metric-card">
                <div class="metric-header">Valor Total</div>
                <div class="metric-body">
                    <div class="metric-value" style="font-size:15px;">${formatarMoeda(totalGeral)}</div>
                    <div class="metric-sublabel">Com impostos</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">

                <div class="metric-header">Média por Registro</div>
                <div class="metric-body">
                    <div class="metric-value" style="font-size:15px;">${formatarMoeda(totalGeral / (dadosVisaoGeralFiltrados.length || 1))}</div>
                    <div class="metric-sublabel">Valor médio</div>
                </div>
            </div>
        </div>
    </div>

    <!-- TOOLBAR -->
    <div class="toolbar">
        <div class="toolbar-left">
            <button class="btn-export" onclick="exportarTabelaVGCSV()">
                <i class="material-icons">description</i> CSV
            </button>
            <button class="btn-export" onclick="exportarTabelaVGPDF()">
                <i class="material-icons">print</i> PDF

                        return `<tr>

function filtrarBuscaRapidaVG(valor) {
    valor = valor.toLowerCase();
    document.querySelectorAll('#tbodyVG tr').forEach(tr => {
        tr.style.display = tr.textContent.toLowerCase().includes(valor) ? '' : 'none';
    });
}

window.mudarAnoVG = function() {
    const ano = document.getElementById('filtroAnoVG')?.value;
    if (ano && ano !== anoAtual) alterarAno(ano, 'vg');
};

window.aplicarFiltrosVG = function() {
    const orgao    = document.getElementById('filtroOrgaoVG')?.value;
    const natureza = document.getElementById('filtroNaturezaVG')?.value;
    const indicador = document.getElementById('filtroIndicadorVG')?.value;
    dadosVisaoGeralFiltrados = dadosVisaoGeral.filter(item => {
        if (orgao    && !item.orgao.includes(orgao)) return false;
        if (natureza && item.natureza !== natureza)  return false;
        if (indicador && item.indicador !== indicador) return false;
        return true;
    });
    sortConfigVG = { column: 'total', direction: 'desc' };
    dadosVisaoGeralFiltrados.sort((a,b) => b.total - a.total);
    renderizarVisaoGeral();
};

window.limparFiltrosVG = function() {
    document.getElementById('filtroOrgaoVG').value = '';
    document.getElementById('filtroNaturezaVG').value = '';
    document.getElementById('filtroIndicadorVG').value = '';
    dadosVisaoGeralFiltrados = [...dadosVisaoGeral];
    sortConfigVG = { column: 'total', direction: 'desc' };
    dadosVisaoGeralFiltrados.sort((a,b) => b.total - a.total);
    renderizarVisaoGeral();
};

window.ordenarVisaoGeral = function(coluna) {
    if (sortConfigVG.column === coluna)
        sortConfigVG.direction = sortConfigVG.direction === 'asc' ? 'desc' : 'asc';
    else { sortConfigVG.column = coluna; sortConfigVG.direction = 'asc'; }
    dadosVisaoGeralFiltrados.sort((a, b) => {

function aplicarFiltrosNotas() {
    const orgao    = document.getElementById('filtroOrgaoNotas')?.value;

    const fornecedor = document.getElementById('filtroFornecedorNotas')?.value;

        : [...todasNotas];

};

window.ordenarNotas = function(coluna) {
    if (sortConfigNotas.column === coluna)
        sortConfigNotas.direction = sortConfigNotas.direction === 'asc' ? 'desc' : 'asc';
    else { sortConfigNotas.column = coluna; sortConfigNotas.direction = 'asc'; }
    notasFiltradas.sort((a, b) => {
        let va = a[coluna] !== undefined ? a[coluna] : '';
        let vb = b[coluna] !== undefined ? b[coluna] : '';
        if (coluna === 'valor_total_com_impostos') { va = parseFloat(va)||0; vb = parseFloat(vb)||0; }
        else if (coluna === 'data_de_emissao') { va = va ? new Date(va) : new Date(0); vb = vb ? new Date(vb) : new Date(0); }
        else { va = String(va).toLowerCase(); vb = String(vb).toLowerCase(); }
        return sortConfigNotas.direction === 'asc' ? (va > vb ? 1 : -1) : (va < vb ? 1 : -1);
    });
    atualizarTabelaNotas();
};

function renderizarPaginacao(containerId, paginaAtual, totalPaginas, funcMudar, totalItens, itensPorPag, funcAlterarQtd) {
    const container = document.getElementById(containerId);
    if (!container) return;

    const opcoesQtd = [10, 25, 50, 100];
    const selectorQtd = `
        <select class="items-per-page" onchange="${funcAlterarQtd}(this.value)">
            ${opcoesQtd.map(n => `<option value="${n}" ${itensPorPag===n?'selected':''}>${n} / pág</option>`).join('')}
        </select>`;

    if (totalPaginas <= 1) {
        container.innerHTML = `
            <div class="pagination-info">1 de 1 — ${totalItens.toLocaleString('pt-BR')} registros</div>
            ${selectorQtd}`;
        return;
    }

    let paginasHtml = '';
    const inicio = Math.max(1, Math.min(paginaAtual - 2, Math.max(1, totalPaginas - 4)));
    const fim    = Math.min(totalPaginas, inicio + 4);
    for (let i = inicio; i <= fim; i++) {
        paginasHtml += `<li class="page-item ${i===paginaAtual?'active':''}">
            <a class="page-link" href="#" onclick="${funcMudar}(${i});return false;">${i}</a>
        </li>`;
    }

    container.innerHTML = `

function exportarCSV(dados, colunas, nomeArquivo) {
    const cab = colunas.join(';');
    const linhas = dados.map(item =>
        colunas.map(col => {
            let v = item[col] !== undefined ? item[col] : '';
            if (typeof v === 'number') v = v.toString().replace('.', ',');
            else if (v) v = v.replace(/"/g, '""');
            return `"${v}"`;
        }).join(';')
    ).join('\n');
    const blob = new Blob(['\uFEFF' + cab + '\n' + linhas], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = nomeArquivo;
    a.click();
}

function exportarPDF(titulo, cabecalho, corpo, nomeArquivo) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'landscape' });
    doc.setFontSize(11);
    doc.text(titulo, 14, 12);
    doc.autoTable({
        head: cabecalho,
        body: corpo,
        startY: 18,
        styles: { fontSize: 7, cellPadding: 2 },
        headStyles: { fillColor: [32, 68, 93] },
        footStyles: { fillColor: [223, 227, 232], textColor: [0,0,0], fontStyle: 'bold' },
        didDrawPage: (data) => {
            doc.setFontSize(8);
            doc.text(`Emitido em: ${new Date().toLocaleString('pt-BR')}`, 14, doc.internal.pageSize.height - 5);
            doc.text(`Pág. ${data.pageNumber}`, doc.internal.pageSize.width - 20, doc.internal.pageSize.height - 5);
        }
    });
    doc.save(nomeArquivo);
}

(function() {
    function sendHeight() {
        const h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight) + 10;
        try { window.parent.postMessage({ iframeHeight: h, iframeResize: true, type: 'resize' }, '*'); } catch(e) {}
    }
    if (window.ResizeObserver) new ResizeObserver(sendHeight).observe(document.body);
    else { window.addEventListener('resize', sendHeight); setInterval(sendHeight, 2000); }
    sendHeight();
})();
